<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>윤재현 | 소개</title>
  <!-- 웹폰트: Noto Sans KR (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       색상 설정 — 메인 색상을 바꾸려면 --primary 값만 고치면 됩니다
       ========================================================= */
    :root {
      --primary: #1E3A8A;        /* 메인 색상 (네이비) */
      --primary-soft: #E0E7FF;   /* 메인 색상의 연한 버전 */
      --bg: #FFFFFF;             /* 페이지 배경 */
      --bg-alt: #F5F7FB;         /* 섹션 교차 배경 */
      --card: #FFFFFF;           /* 카드 배경 */
      --text: #111827;           /* 기본 글자색 */
      --text-sub: #6B7280;       /* 보조 글자색 */
      --border: #E5E7EB;         /* 테두리 */
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --radius: 16px;
    }
    /* 다크 모드 색상 */
    :root[data-theme="dark"] {
      --primary: #7C9CFF;
      --primary-soft: #1E2A4D;
      --bg: #0F1420;
      --bg-alt: #151B2B;
      --card: #1A2133;
      --text: #F3F4F6;
      --text-sub: #9CA3AF;
      --border: #2A3348;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    section { padding: 100px 0; scroll-margin-top: 64px; }
    section:nth-of-type(even) { background: var(--bg-alt); }

    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 900;
      margin-bottom: 48px;
      text-align: center;
    }
    .section-title::after {
      content: ""; display: block; width: 48px; height: 4px;
      background: var(--primary); border-radius: 2px; margin: 12px auto 0;
    }

    .btn {
      display: inline-block; padding: 12px 28px; border-radius: 999px;
      background: var(--primary); color: #fff; font-weight: 700;
      border: none; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
      font-family: inherit; font-size: 1rem;
    }
    :root[data-theme="dark"] .btn { color: #0F1420; }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }

    /* ===================== 1. 상단 메뉴바 ===================== */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px; background: var(--bg);
      transition: box-shadow 0.3s, background 0.3s;
    }
    .navbar.scrolled { box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1); }
    .navbar .container { display: flex; align-items: center; justify-content: space-between; height: 100%; }
    .logo { font-size: 1.25rem; font-weight: 900; color: var(--primary); }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-menu { display: flex; gap: 4px; list-style: none; }
    .nav-menu a {
      padding: 8px 12px; border-radius: 8px; font-weight: 500;
      color: var(--text-sub); transition: color 0.2s, background 0.2s;
    }
    .nav-menu a:hover { color: var(--primary); }
    .nav-menu a.active { color: var(--primary); background: var(--primary-soft); }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text); cursor: pointer; font-size: 1.1rem;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hamburger { display: none; }

    /* ===================== 2. 메인(Hero) ===================== */
    .hero {
      min-height: 100vh; display: flex; align-items: center; padding-top: 64px;
      background: radial-gradient(circle at 80% 20%, var(--primary-soft), transparent 50%), var(--bg);
    }
    .hero .container { display: flex; align-items: center; gap: 56px; }
    .hero-photo {
      width: 240px; height: 240px; flex-shrink: 0; border-radius: 50%;
      object-fit: cover; border: 6px solid var(--card); box-shadow: var(--shadow);
      background: var(--primary); color: #fff; font-size: 5rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .hero-greeting { color: var(--primary); font-weight: 700; margin-bottom: 8px; }
    .hero-name { font-size: clamp(2.4rem, 6vw, 4rem); font-weight: 900; line-height: 1.2; }
    .hero-tagline { font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--text-sub); margin: 12px 0 8px; }
    .hero-typing { font-size: clamp(1.1rem, 2.4vw, 1.5rem); font-weight: 700; min-height: 2.2em; margin-bottom: 28px; }
    .hero-typing .cursor { display: inline-block; width: 2px; background: var(--primary); margin-left: 2px; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ===================== 3. 자기소개 ===================== */
    .about-wrap { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
    .about-text { font-size: 1.1rem; white-space: pre-line; }
    .info-list { list-style: none; display: grid; gap: 12px; }
    .info-list li {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; display: flex; gap: 12px;
    }
    .info-list .label { color: var(--text-sub); min-width: 72px; }
    .info-list .value { font-weight: 700; }

    /* ===================== 4. 기술/역량 ===================== */
    .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 48px; max-width: 860px; margin: 0 auto; }
    .skill-head { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; }
    .skill-head .pct { color: var(--primary); }
    .skill-bar { height: 10px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .skill-fill {
      height: 100%; width: 0; background: var(--primary); border-radius: 999px;
      transition: width 1.2s cubic-bezier(.2,.8,.2,1);
    }

    /* ===================== 5. 경력/이력 (타임라인) ===================== */
    .timeline { position: relative; max-width: 760px; margin: 0 auto; padding-left: 32px; }
    .timeline::before {
      content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px;
      width: 2px; background: var(--border);
    }
    .tl-item { position: relative; margin-bottom: 32px; }
    .tl-item:last-child { margin-bottom: 0; }
    .tl-item::before {
      content: ""; position: absolute; left: -32px; top: 6px; width: 16px; height: 16px;
      border-radius: 50%; background: var(--bg); border: 4px solid var(--primary);
    }
    .tl-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; }
    .tl-period { font-size: 0.9rem; color: var(--primary); font-weight: 700; }
    .tl-org { font-size: 1.2rem; font-weight: 900; }
    .tl-role { color: var(--text-sub); margin-bottom: 6px; }

    /* ===================== 6. 프로젝트 ===================== */
    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .project-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .project-card:hover { transform: translateY(-8px); box-shadow: var(--shadow); }
    .project-thumb {
      aspect-ratio: 16 / 10; width: 100%; object-fit: cover;
      background: var(--primary-soft); color: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .project-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .project-body h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .project-body p { color: var(--text-sub); font-size: 0.95rem; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .tag { font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 500; }
    .project-link { color: var(--primary); font-weight: 700; }

    /* ===================== 7. 연락처 ===================== */
    .contact-box { max-width: 560px; margin: 0 auto; text-align: center; }
    .contact-box > p { color: var(--text-sub); margin-bottom: 24px; }
    .email-row {
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 20px; margin-bottom: 24px;
    }
    .email-row a { font-weight: 700; font-size: 1.1rem; word-break: break-all; }
    .copy-btn { padding: 8px 16px; font-size: 0.9rem; }
    .sns-list { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .sns-list a {
      padding: 10px 20px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--card); font-weight: 500; transition: border-color 0.2s, color 0.2s;
    }
    .sns-list a:hover { border-color: var(--primary); color: var(--primary); }

    /* ===================== 8. 푸터 ===================== */
    footer { padding: 32px 0; text-align: center; color: var(--text-sub); font-size: 0.9rem; border-top: 1px solid var(--border); }

    /* ===================== 공통 효과 ===================== */
    /* 스크롤 시 아래에서 나타나는 효과 */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s, transform 0.8s; }
    .reveal.visible { opacity: 1; transform: none; }

    /* 맨 위로 버튼 */
    .to-top {
      position: fixed; right: 20px; bottom: 20px; width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary); color: #fff; border: none; cursor: pointer; font-size: 1.3rem;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s; z-index: 90;
    }
    :root[data-theme="dark"] .to-top { color: #0F1420; }
    .to-top.show { opacity: 1; pointer-events: auto; transform: none; }

    /* 복사 알림(토스트) */
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
      background: var(--text); color: var(--bg); padding: 12px 22px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===================== 반응형 (태블릿) ===================== */
    @media (max-width: 900px) {
      .projects-grid { grid-template-columns: 1fr 1fr; }
      .about-wrap { grid-template-columns: 1fr; }
    }
    /* ===================== 반응형 (모바일) ===================== */
    @media (max-width: 720px) {
      section { padding: 72px 0; }
      .hamburger { display: inline-flex; }
      .nav-menu {
        position: absolute; top: 64px; left: 0; right: 0; flex-direction: column;
        background: var(--bg); padding: 8px 20px 16px; gap: 2px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        display: none;
      }
      .nav-menu.open { display: flex; }
      .nav-menu a { display: block; padding: 12px; }
      .hero .container { flex-direction: column; text-align: center; gap: 28px; }
      .hero-photo { width: 160px; height: 160px; font-size: 3.5rem; }
      .skills-grid, .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 1. 상단 메뉴바 -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="#home" class="logo" data-bind="logo"></a>
      <div class="nav-right">
        <ul class="nav-menu" id="navMenu">
          <li><a href="#about">소개</a></li>
          <li><a href="#skills">역량</a></li>
          <li><a href="#experience">경력</a></li>
          <li><a href="#projects">프로젝트</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
        <button class="icon-btn" id="themeToggle" aria-label="라이트/다크 모드 전환">🌙</button>
        <button class="icon-btn hamburger" id="hamburger" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </nav>

  <!-- 2. 메인(Hero) 섹션 -->
  <header class="hero" id="home">
    <div class="container">
      <div id="heroPhoto"></div>
      <div>
        <p class="hero-greeting">안녕하세요 👋</p>
        <h1 class="hero-name" data-bind="name"></h1>
        <p class="hero-tagline" data-bind="tagline"></p>
        <p class="hero-typing"><span id="typing"></span><span class="cursor">&nbsp;</span></p>
        <a href="#contact" class="btn">연락하기</a>
      </div>
    </div>
  </header>

  <main>
    <!-- 3. 자기소개(About) -->
    <section id="about">
      <div class="container reveal">
        <h2 class="section-title">자기소개</h2>
        <div class="about-wrap">
          <p class="about-text" data-bind="about"></p>
          <ul class="info-list" id="infoList"></ul>
        </div>
      </div>
    </section>

    <!-- 4. 기술/역량(Skills) -->
    <section id="skills">
      <div class="container reveal">
        <h2 class="section-title">기술 · 역량</h2>
        <div class="skills-grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- 5. 경력/이력(Experience) -->
    <section id="experience">
      <div class="container reveal">
        <h2 class="section-title">경력 · 이력</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- 6. 프로젝트(Projects) -->
    <section id="projects">
      <div class="container reveal">
        <h2 class="section-title">프로젝트</h2>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- 7. 연락처(Contact) -->
    <section id="contact">
      <div class="container reveal">
        <h2 class="section-title">연락처</h2>
        <div class="contact-box">
          <p>궁금한 점이나 함께하고 싶은 일이 있다면 편하게 연락주세요.</p>
          <div class="email-row">
            <a id="emailLink"></a>
            <button class="btn copy-btn" id="copyBtn">복사</button>
          </div>
          <div class="sns-list" id="snsList"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 8. 푸터 -->
  <footer>
    <div class="container" id="footerText"></div>
  </footer>

  <button class="to-top" id="toTop" aria-label="맨 위로">↑</button>
  <div class="toast" id="toast">이메일 주소가 복사되었습니다</div>

  <script>
    /* ==================================================================
       ✏️ 내 정보 입력 영역 — 이 PROFILE 안의 값만 고치면 페이지 전체가 바뀝니다!
       - 지금 들어있는 값은 예비 내용입니다. 언제든 자유롭게 수정하세요.
       - [대괄호]로 남아 있는 곳은 아직 채우지 않은 부분입니다.
       - 항목(역량, 경력, 프로젝트, SNS)은 { ... } 묶음을 복사/삭제해서 개수를 늘리거나 줄일 수 있습니다.
       ================================================================== */
    const PROFILE = {
      // 상단 메뉴바 왼쪽 로고 글자
      logo: "윤재현",

      // 메인(Hero) 섹션
      name: "윤재현",
      tagline: "[한 줄 소개 — 예: 사람을 돕는 로봇을 만드는 엔지니어]",
      photo: "",   // 프로필 사진 경로 또는 URL (예: "profile.jpg"). 비워두면 이름 첫 글자가 표시됩니다.
      typingPhrases: ["[문구1]", "[문구2]", "[문구3]"],  // 타이핑 효과로 번갈아 나오는 문구

      // 자기소개(About)
      about: "안녕하세요 저는 윤재현입니다.",   // 줄바꿈하려면 \n 을 넣으세요
      info: [
        { label: "소속/직업", value: "나우 / 엔지니어" },
        { label: "지역",     value: "클로드시" },
        { label: "관심 분야", value: "기계설계 및 로봇" },
      ],

      // 기술/역량(Skills) — level 은 0~100 사이 숫자(%)
      skills: [
        { name: "CAD",     level: 80 },
        { name: "코딩",     level: 50 },
        { name: "[역량3]", level: 60 },
        { name: "[역량4]", level: 40 },
      ],

      // 경력/이력(Experience) — 위에서부터 순서대로 타임라인에 표시됩니다
      experience: [
        { period: "[기간]", org: "클로드대학교", role: "[전공/역할]", desc: "[주요 내용]" },
        { period: "[기간]", org: "클로드사",     role: "엔지니어",     desc: "클로드 만들기" },
        { period: "[기간]", org: "[회사/학교명]", role: "[역할]",      desc: "[주요 내용]" },
      ],

      // 프로젝트(Projects) — image 를 비워두면 프로젝트명이 적힌 기본 박스가 표시됩니다
      projects: [
        { image: "", title: "[프로젝트명1]", desc: "[프로젝트 설명]", tech: ["[기술1]", "[기술2]"], link: "[링크]" },
        { image: "", title: "[프로젝트명2]", desc: "[프로젝트 설명]", tech: ["[기술1]", "[기술2]"], link: "[링크]" },
        { image: "", title: "[프로젝트명3]", desc: "[프로젝트 설명]", tech: ["[기술1]", "[기술2]"], link: "[링크]" },
      ],

      // 연락처(Contact)
      email: "[이메일 주소]",
      sns: [
        { name: "GitHub",    url: "[GitHub URL]" },
        { name: "LinkedIn",  url: "[LinkedIn URL]" },
        { name: "Instagram", url: "[Instagram URL]" },
      ],

      // 푸터 — 연도는 비워두면 올해 연도가 자동으로 들어갑니다
      footerYear: "",
    };
    /* ======================= 입력 영역 끝 ======================= */


    /* ---------- 아래부터는 동작 코드입니다 (보통은 고칠 필요 없음) ---------- */

    // 아직 [대괄호] 상태인 값인지 확인 (링크가 비어 있으면 클릭해도 이동하지 않게)
    const isPlaceholder = (v) => !v || /^\[.*\]$/.test(String(v).trim());

    // 요소를 간단하게 만드는 도우미 함수
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // data-bind 속성이 있는 곳에 PROFILE 값 채우기
    document.querySelectorAll("[data-bind]").forEach((node) => {
      node.textContent = PROFILE[node.dataset.bind];
    });
    document.title = `${PROFILE.name} | 소개`;

    // 프로필 사진 (없으면 이름 첫 글자)
    (function renderPhoto() {
      const slot = document.getElementById("heroPhoto");
      if (!isPlaceholder(PROFILE.photo)) {
        const img = el("img", "hero-photo");
        img.src = PROFILE.photo;
        img.alt = `${PROFILE.name} 프로필 사진`;
        slot.replaceWith(img);
      } else {
        slot.className = "hero-photo";
        slot.textContent = PROFILE.name.charAt(0);
      }
    })();

    // 자기소개 기본 정보
    PROFILE.info.forEach((item) => {
      const li = el("li");
      li.append(el("span", "label", item.label), el("span", "value", item.value));
      document.getElementById("infoList").append(li);
    });

    // 역량 막대
    PROFILE.skills.forEach((s) => {
      const wrap = el("div");
      const head = el("div", "skill-head");
      head.append(el("span", "", s.name), el("span", "pct", `${s.level}%`));
      const bar = el("div", "skill-bar");
      const fill = el("div", "skill-fill");
      fill.dataset.level = s.level;
      bar.append(fill);
      wrap.append(head, bar);
      document.getElementById("skillsGrid").append(wrap);
    });

    // 경력 타임라인
    PROFILE.experience.forEach((e) => {
      const item = el("div", "tl-item");
      const card = el("div", "tl-card");
      card.append(
        el("div", "tl-period", e.period),
        el("div", "tl-org", e.org),
        el("div", "tl-role", e.role),
        el("p", "", e.desc)
      );
      item.append(card);
      document.getElementById("timeline").append(item);
    });

    // 프로젝트 카드
    PROFILE.projects.forEach((p) => {
      const card = el("article", "project-card");
      let thumb;
      if (!isPlaceholder(p.image)) {
        thumb = el("img", "project-thumb");
        thumb.src = p.image;
        thumb.alt = p.title;
      } else {
        thumb = el("div", "project-thumb", p.title);
      }
      const body = el("div", "project-body");
      const tags = el("div", "tags");
      p.tech.forEach((t) => tags.append(el("span", "tag", t)));
      const link = el("a", "project-link", "자세히 보기 →");
      link.href = isPlaceholder(p.link) ? "#projects" : p.link;
      if (!isPlaceholder(p.link)) { link.target = "_blank"; link.rel = "noopener"; }
      body.append(el("h3", "", p.title), el("p", "", p.desc), tags, link);
      card.append(thumb, body);
      document.getElementById("projectsGrid").append(card);
    });

    // 연락처
    const emailLink = document.getElementById("emailLink");
    emailLink.textContent = PROFILE.email;
    emailLink.href = isPlaceholder(PROFILE.email) ? "#contact" : `mailto:${PROFILE.email}`;
    PROFILE.sns.forEach((s) => {
      const a = el("a", "", s.name);
      a.href = isPlaceholder(s.url) ? "#contact" : s.url;
      if (!isPlaceholder(s.url)) { a.target = "_blank"; a.rel = "noopener"; }
      document.getElementById("snsList").append(a);
    });

    // 푸터
    const year = PROFILE.footerYear || new Date().getFullYear();
    document.getElementById("footerText").textContent = `© ${year} ${PROFILE.name}. All rights reserved.`;


    /* ---------- 라이트/다크 모드 ---------- */
    const root = document.documentElement;
    const themeBtn = document.getElementById("themeToggle");
    function setTheme(theme) {
      root.dataset.theme = theme;
      themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
      try { localStorage.setItem("theme", theme); } catch (e) {}
    }
    let savedTheme = null;
    try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
    setTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));

    /* ---------- 모바일 햄버거 메뉴 ---------- */
    const navMenu = document.getElementById("navMenu");
    document.getElementById("hamburger").addEventListener("click", () => navMenu.classList.toggle("open"));
    navMenu.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => navMenu.classList.remove("open")));

    /* ---------- 타이핑 효과 ---------- */
    (function typing() {
      const target = document.getElementById("typing");
      const phrases = PROFILE.typingPhrases;
      let i = 0, j = 0, deleting = false;
      function tick() {
        const word = phrases[i];
        target.textContent = word.slice(0, j);
        if (!deleting && j < word.length) { j++; setTimeout(tick, 90); }
        else if (!deleting) { deleting = true; setTimeout(tick, 1600); }
        else if (j > 0) { j--; setTimeout(tick, 45); }
        else { deleting = false; i = (i + 1) % phrases.length; setTimeout(tick, 300); }
      }
      if (phrases.length) tick();
    })();

    /* ---------- 스크롤 시 섹션 나타나기 + 역량 막대 채우기 ---------- */
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("visible");
        entry.target.querySelectorAll(".skill-fill").forEach((f) => (f.style.width = f.dataset.level + "%"));
        revealObserver.unobserve(entry.target);
      });
    }, { threshold: 0.15 });
    document.querySelectorAll(".reveal").forEach((node) => revealObserver.observe(node));

    /* ---------- 메뉴바 그림자 + 맨 위로 버튼 + 현재 섹션 강조 ---------- */
    const navbar = document.getElementById("navbar");
    const toTop = document.getElementById("toTop");
    const menuLinks = [...navMenu.querySelectorAll("a")];
    const sections = menuLinks.map((a) => document.querySelector(a.getAttribute("href")));

    function onScroll() {
      const y = window.scrollY;
      navbar.classList.toggle("scrolled", y > 10);
      toTop.classList.toggle("show", y > 400);

      // 화면 위쪽 1/3 지점을 지난 마지막 섹션을 '현재 섹션'으로 표시
      let current = -1;
      sections.forEach((sec, idx) => {
        if (sec.getBoundingClientRect().top <= window.innerHeight / 3) current = idx;
      });
      // 페이지 맨 아래에 닿으면 마지막 섹션(연락처) 강조
      if (window.innerHeight + y >= document.body.scrollHeight - 2) current = sections.length - 1;
      menuLinks.forEach((a, idx) => a.classList.toggle("active", idx === current));
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    /* ---------- 이메일 복사 ---------- */
    const toast = document.getElementById("toast");
    document.getElementById("copyBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(PROFILE.email);
        toast.textContent = "이메일 주소가 복사되었습니다";
      } catch (e) {
        toast.textContent = "복사에 실패했어요. 직접 선택해서 복사해주세요";
      }
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    });
  </script>
</body>
</html>
